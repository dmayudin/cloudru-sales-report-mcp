[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudru-sales-mcp"
version = "0.3.0"
description = "Scenario-scoped Cloud.ru Data Platform, S3 and ClickHouse MCP"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2", "httpx>=0.28,<1", "boto3>=1.40,<2"]

[project.scripts]
cloudru-sales-mcp = "cloudru_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["cloudru_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

